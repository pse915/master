function gatherSchedule(){

      for(const period of d.periods){let count=0;
        for(const c of own){const x=S.editingCells[`${grade}|${d.day}|${period}|${c.id}`]||{type:'EXAM',subject:'',active:true};
          if(x.active===false)continue;
          if(x.type==='EXAM'&&!x.subject?.trim())throw new Error(`${grade}학년 ${d.day}일차 ${period}교시 ${c.id} 시험과목을 입력하세요.`);

        }

      }

}

function addRosterTeacher(){
  const ids=$$('[data-roster-field="id"]').map(input=>input.value.trim()).concat(S.admin.roster.teachers.map(teacher=>teacher.id));let next=Math.max(0,...ids.filter(id=>/^\d+$/.test(id)).map(Number))+1;

  S.rosterRows.push({key:'new_'+Date.now()+'_'+S.rosterRows.length,originalId:'',id:String(next),name:'',subjectsText:'',crossSubjectsText:'',homeroom:'',MAIN:'O',ASSIST:'O',STUDY:'O'});
  dirtyGroups_.add('roster');renderSettings();
}
function removeRosterTeacher(button){
  const element=button.closest('[data-roster-row]'),key=element.dataset.rosterRow;
  const row=S.rosterRows.find(teacher=>teacher.key===key);if(!row)return;

  const name=element.querySelector('[data-roster-field="name"]').value.trim()||'새 교사';
  if(!confirm(`${name} 교사를 명단에서 삭제할까요?\n명단 변경 저장을 눌러야 시트에 반영됩니다. 저장 시 이 교사의 배정불가·겸임·감독규칙·강사 지정도 정리합니다. 수업시간표와 과거 기록은 보존합니다.`))return;
  if(row.originalId){S.rosterDeletedIds=S.rosterDeletedIds||[];S.rosterDeletedIds.push(row.originalId);}
  S.rosterRows=S.rosterRows.filter(teacher=>teacher.key!==key);

function showAvailabilityDetails(index){
  const slot=S.admin?.availabilityReport?.slots?.[index];
  if(!slot)return toast('제외 내역을 다시 불러와 주세요.','error');
  const reasons=Object.entries(slot.reasons||{}).sort((a,b)=>b[1]-a[1]);
  const people=slot.excludedTeachers||[];
  const summary=`<p class="hint">서로 다른 사유로 중복 집계된 교사는 제외 인원에 한 번만 포함됩니다.</p><div class="kpis"><div class="kpi"><span>감독 가능 교사</span><b>${slot.possible}명</b></div><div class="kpi"><span>제외 교사</span><b>${slot.excluded}명</b></div></div>`;
  const byReason=`<h4>제외 사유별 건수 (중복 허용)</h4><div class="cards">${reasons.map(([reason,count])=>`<div class="card"><b>${e(reason)}</b> · ${count}명</div>`).join('')||'<p>제외 사유가 없습니다.</p>'}</div>`;
  const detail=people.length?`<h4>제외된 교사별 상세</h4><div class="tablewrap"><table class="data"><thead><tr><th>교사</th><th>제외 사유</th></tr></thead><tbody>${people.map(t=>`<tr><td>${e(t.name)}</td><td>${(t.reasons||[]).map(e).join('<div></div>')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="hint">이번 교시에는 제외된 교사가 없습니다.</p>';
  modal(`${slot.date} · ${slot.period}교시 감독 가능 인원`,summary+byReason+detail);
}
function toggleRuleMode(){
  const include=$('#ruleMode')?.value==='포함';
  if($('#ruleClass'))$('#ruleClass').disabled=!include;
  if(!include&&$('#ruleClass'))$('#ruleClass').value='';
}
function addTeachingRule(){
  const id=$('#ruleTeacher')?.value,t=S.admin.roster.teachers.find(x=>x.id===id);
  const row={teacherName:t?.name||'',mode:$('#ruleMode')?.value,date:$('#ruleDate')?.value||'',endDate:$('#ruleEndDate')?.value||'',
    weekday:$('#ruleWeekday')?.value||'',period:$('#rulePeriod')?.value||'',
    classId:$('#ruleMode')?.value==='포함'?$('#ruleClass')?.value||'':'',reason:$('#ruleReason')?.value.trim()||''};
  if(!row.teacherName)return toast('교사를 선택하세요.','error');
  if(!row.date&&!row.weekday)return toast('시작일 또는 반복 요일을 입력하세요.','error');
  if(row.endDate&&!row.date)return toast('종료일을 설정하려면 시작일도 필요합니다.','error');
  if(row.endDate&&row.endDate<row.date)return toast('종료일이 시작일보다 빠를 수 없습니다.','error');
  if(row.date&&row.weekday&&!row.endDate){const wd=['일','월','화','수','목','금','토'][new Date(row.date+'T12:00:00Z').getUTCDay()];
    if(wd!==row.weekday)return toast('단일 날짜와 요일이 일치하지 않습니다.','error');}
  if(row.mode==='포함'){
    if(!row.date||!row.period)return toast('포함 규칙에는 시작일과 교시가 필요합니다.','error');
    if(row.reason.length<4)return toast('포함 시 수업을 비우는 방법을 포함해 사유를 4자 이상 적으세요.','error');
    if(!confirm('이 교사의 정규수업이 실제로 해제되거나 대체 인력이 배치됐습니까? 다른 절대 금지 조건은 유지됩니다.'))return;
  }else if(row.reason.length<2)return toast('제외 사유를 2자 이상 적으세요.','error');
  S.teachingRules.push(row);renderTeaching();
}
function removeTeachingRule(i){if(!confirm('선택한 교사 포함·제외 규칙을 삭제하시겠습니까?'))return;S.teachingRules.splice(i,1);renderTeaching();}

function fairnessCharts(stats){stats=stats.filter(t=>!t.isInstructor);if(!stats.length)return '';
  const max=Math.max(1,...stats.map(x=>x.total)),freq={};stats.forEach(t=>freq[t.total]=(freq[t.total]||0)+1);
  const series=Object.keys(freq).map(Number).sort((a,b)=>a-b),peak=Math.max(...Object.values(freq));
  return `<div class="cards"><div class="card"><h3>전체 감독 횟수 분포</h3>${series.map(n=>`<div class="hint">${n}회 — ${freq[n]}명</div><div class="bar"><span style="width:${100*freq[n]/peak}%"></span></div>`).join('')}</div>
  <div class="card"><h3>정·부·자습 감독 유형 구성</h3><div class="chart-legend"><span class="main">정감독</span><span class="assist">부감독</span><span class="study">자습감독</span></div>
  ${stats.slice().sort((a,b)=>b.total-a.total).map(t=>`<div class="hint" style="margin-top:5px">${e(t.name)} · ${t.total}회</div><div class="stack" style="width:${Math.max(12,100*t.total/max)}%"><span class="main" style="width:${t.total?100*t.main/t.total:0}%"></span><span class="assist" style="width:${t.total?100*t.assist/t.total:0}%"></span><span class="study" style="width:${t.total?100*t.study/t.total:0}%"></span></div>`).join('')}</div></div>`;
}
function renderFair(){
  const a=S.admin,stats=(a.activeVersion?S.confirmed?.stats:a.stats)||[],report=S.optimizationReport;
  const enrich=new Map((report?.teachers||[]).map(t=>[String(t.id),t]));
  const m=report?.metrics,fmt=x=>typeof x==='number'?Number(x.toFixed(2)):x;
  const kpis=m?`<div class="kpis">
    <div class="kpi"><span>정감독 횟수 편차</span><b>${m.mainSpread}회</b></div>
    <div class="kpi"><span>부감독 횟수 편차</span><b>${m.assistSpread}회</b></div>
    <div class="kpi"><span>자습감독 횟수 편차</span><b>${m.studySpread}회</b></div>
    <div class="kpi"><span>가중 부담 편차</span><b>${fmt(m.burdenSpread)}점</b></div>
    <div class="kpi"><span>감독으로 추가된 3연강</span><b>${m.addedThree}건</b></div>
    <div class="kpi"><span>추가된 4연강 이상</span><b>${m.addedFour}건</b></div>
  </div>`:'<p class="hint">정규수업·감독 통합 분석을 불러오는 중입니다. <button class="btn" onclick="loadOptimizationReport()">분석 불러오기</button></p>';
  $('#app').innerHTML=`<section class="panel">${baseTitle('감독 공정성·연강 분석','정·부·자습 감독 횟수, 3:2:1 업무 강도, 실제 남아 있는 정규수업을 모두 고려합니다.',
    '<button class="btn" onclick="loadOptimizationReport()">분석 새로고침</button><button class="btn" onclick="compareGradeBonus()">담당 학년 우대 0%와 비교</button>')}${metrics(stats)}${kpis}${fairnessCharts(stats)}
  <div class="tablewrap"><table class="data"><thead><tr><th>교사</th><th>정</th><th>부</th><th>자습</th><th>전체</th><th>부담 점수</th><th>최대 연강</th><th>추가 3/4연강</th><th>주 담당 학년</th><th>분석</th></tr></thead><tbody>
  ${stats.slice().sort((x,y)=>y.total-x.total).map(t=>{const v=enrich.get(String(t.id));return `<tr><td>${e(t.name)} <span class="muted">${e(t.id)}</span>${t.isInstructor?' · 강사':''}</td>
    <td>${t.main}</td><td>${t.assist}</td><td>${t.study}</td><td><b>${t.total}</b></td>
    <td>${v?fmt(v.burden):'-'}</td><td>${v?v.maxBefore+' → '+v.maxAfter:'-'}</td>
    <td>${v?v.addedThree+' / '+v.addedFour:'-'}</td><td>${v&&v.primaryGrade?v.primaryGrade+'학년':'미분류'}</td>
    <td><button class="btn" onclick="explain(${e(JSON.stringify(t.id))})">이유 보기</button></td></tr>`;}).join('')||'<tr><td colspan="10">배정 결과가 없습니다.</td></tr>'}</tbody></table></div>
  <p class="hint">가중 부담은 기본 정감독 3·부감독 2·자습감독 1점입니다. 모든 교사가 동일한 횟수로 감독하는 것은 자리 수와 제약에 따라 불가능할 수 있습니다. '추가 연강'은 기존 수업 대비 감독 배정이 새로 만든 연강입니다.</p></section>`;
}

}
async function explain(teacherId){const x=await work('공정성 설명',()=>call('fairness',{teacherId}));if(!x)return;
  const t=x.teacher;
  modal(`${t.name} 선생님 — 감독 ${t.total}회`, `<div class="kpis"><div class="kpi"><span>정감독</span><b>${t.main}</b></div><div class="kpi"><span>부감독</span><b>${t.assist}</b></div><div class="kpi"><span>자습</span><b>${t.study}</b></div><div class="kpi"><span>전체 평균 대비</span><b>${t.delta}</b></div></div>
  <p>후보가 되는 감독 자리: ${x.eligibleJobs}/${x.totalJobs}개</p><p>가중 부담 ${e(t.burden)}점 · 기존 최대 ${e(t.maxBefore)}연강 → 배정 후 최대 ${e(t.maxAfter)}연강 · 새로 생긴 3연강 ${e(t.addedThree)}건 / 4연강 ${e(t.addedFour)}건</p><p>주 담당 학년: ${e(t.primaryGrade||"미분류")}학년 · 학년별 수업 비중 ${e(JSON.stringify(t.gradeShares||{}))}</p>
  <p>강사 자동 제외 ${x.exclusions.강사감독자동제외||0}건, 동일교과 제한 ${x.exclusions.동일교과||0}건, 상치교과 제한 ${x.exclusions.상치교과||0}건, 담임학급 제한 ${x.exclusions.담임학급||0}건, 불가 시간 제한 ${x.exclusions.배정불가||0}건, 정규수업/겸임 관련 제외 ${Object.entries(x.exclusions).filter(([k])=>k.startsWith('정규수업')||k.startsWith('겸임')||k==='타교근무'||k==='교사시간표미등록').reduce((n,[,v])=>n+v,0)}건</p>
  <p>${x.transfer?`규칙을 유지하면서 감독 한 자리를 ${e(x.transfer.toName)} 선생님에게 이전할 수 있는 안을 발견했습니다 (${e(x.transfer.slot)}).`:'탐색 범위 내에서 단일 자리 이전에 의한 공정성 개선안을 발견하지 못했습니다.'}</p>
  <p class="hint">${e(x.explanation)}</p>`);}
